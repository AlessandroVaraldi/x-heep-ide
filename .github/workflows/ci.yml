name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch: # the X-HEEP canary starts it on the release tags it creates

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The tests run inside a VS Code instance, which needs a display.
      - run: xvfb-run -a npm test

  # The extension's steps for a software project, run against the latest X-HEEP
  # in the image X-HEEP's own CI uses: clone, mcu-gen, build, Verilator model, simulation.
  e2e:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/x-heep/x-heep/x-heep-toolchain:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The login shell below resets PATH (Debian's /etc/profile), so remember where node is.
      - run: npm ci && npm run compile-tests && echo "NODE=$(command -v node)" >> "$GITHUB_ENV"
      # Against the pinned X-HEEP commit, the one new projects get (latest main if none is pinned yet).
      - name: Software project end to end
        shell: bash -le {0} # login shell: the image activates conda and its tools in /etc/profile.d
        run: 'XHEEP_COMMIT=$(cat XHEEP_COMMIT) "$NODE" out/test/e2e.js "$RUNNER_TEMP/project"'

  publish:
    needs: [test, e2e]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1; }
      - run: npx @vscode/vsce package
      - run: npx @vscode/vsce publish --packagePath *.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          generate_release_notes: true
